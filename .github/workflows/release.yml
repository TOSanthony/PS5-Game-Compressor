name: Build and release Game Compressor

# Every push to any branch builds the ELF and publishes a GitHub release.
#  - tag v*        -> release named after the tag (as before)
#  - push to main  -> release "v<VERSION>.<run number>" (VERSION file, e.g. v1.1.37)
#  - other branch  -> pre-release "v<VERSION>.<run number>-<branch>"
# Pull requests only build and upload an artifact.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SDK_SHA256: a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the version (VERSION file + run number)
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v${base}.${GITHUB_RUN_NUMBER}"
          fi
          echo "GC_VERSION_TAG=$version" >> "$GITHUB_ENV"
          echo "GC_BASE_MAJOR=${base%%.*}" >> "$GITHUB_ENV"
          echo "GC_BASE_MINOR=${base#*.}" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make makefs python3 unzip curl binutils file

      - name: Download PS5 payload SDK v0.43
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/sdk"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/sdk/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Cache TLS libraries (OpenSSL + libcurl for the self-update)
        id: tls-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk/ps5-payload-sdk/target/user/homebrew
          key: tls-deps-${{ env.SDK_SHA256 }}-${{ hashFiles('tools/build-tls-deps.sh') }}

      - name: Build TLS libraries for the PS5
        if: steps.tls-cache.outputs.cache-hit != 'true'
        run: tools/build-tls-deps.sh

      - name: Build ELF with firmware 13.60 support
        run: |
          python3 tools/check_sdk_fw1360.py "$PS5_PAYLOAD_SDK"
          build_version="$GC_VERSION_TAG"
          make -j"$(nproc)" BUILD_VERSION="$build_version" BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          file game-compressor.elf
          readelf -h game-compressor.elf | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h game-compressor.elf | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'

      - name: Set up .NET 8 (UFS2Tool builds the ffpkg image)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install full-screen app build tools
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config git ca-certificates wget xz-utils zstd tar python3-pil libclang-rt-18-dev

      - name: Build full-screen app (PPSA99290)
        run: |
          # The app's own version (shown in the app and on the console): 01.MMM.PPP.
          content_version="$(printf '%02d.%03d.%03d' "$GC_BASE_MAJOR" "$GC_BASE_MINOR" "$((GITHUB_RUN_NUMBER % 1000))")"
          sed -i "s/\"contentVersion\": \"[0-9.]*\"/\"contentVersion\": \"$content_version\"/" tv-app/sce_sys/param.json
          grep contentVersion tv-app/sce_sys/param.json
          make -C tv-app GC_PAYLOAD=../game-compressor.elf GC_VERSION="$GITHUB_RUN_NUMBER" ffpkg
          cp tv-app/dist/PPSA99290.ffpkg PPSA99290.ffpkg
          cp tv-app/dist/PPSA99290.zip PPSA99290-app.zip

      - name: Build info (read by the in-app updater)
        run: |
          printf '{"build": %s, "version": "%s", "commit": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GC_VERSION_TAG" "$GITHUB_SHA" > build-info.json
          cat build-info.json

      - name: Checksums
        run: |
          files=(game-compressor.elf)
          for f in PPSA99290.ffpkg PPSA99290-app.zip; do
            [[ -f "$f" ]] && files+=("$f")
          done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-compressor-${{ github.sha }}
          path: |
            game-compressor.elf
            PPSA99290.ffpkg
            PPSA99290-app.zip
            build-info.json
            SHA256SUMS

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(game-compressor.elf SHA256SUMS build-info.json)
          for f in PPSA99290.ffpkg PPSA99290-app.zip; do
            [[ -f "$f" ]] && files+=("$f")
          done

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            create_args=(--verify-tag)
          else
            # main: v1.1.<run>; other branches: v1.1.<run>-<branch> (pre-release).
            tag="$GC_VERSION_TAG"
            create_args=(--target "$GITHUB_SHA")
            if [[ "$GITHUB_REF_NAME" != main ]]; then
              branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
              tag="${tag}-${branch}"
              create_args+=(--prerelease)
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" "${create_args[@]}" \
              --generate-notes --title "Game Compressor $tag"
          fi
