name: Build and release Game Compressor

# Every push to any branch builds the ELF and publishes a GitHub release.
#  - tag v*        -> release named after the tag (as before)
#  - push to main  -> release "build-main-<run number>"
#  - other branch  -> pre-release "build-<branch>-<run number>"
# Pull requests only build and upload an artifact.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SDK_SHA256: a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make python3 unzip curl binutils file

      - name: Download PS5 payload SDK v0.43
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/sdk"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/sdk/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build ELF with firmware 13.60 support
        run: |
          python3 tools/check_sdk_fw1360.py "$PS5_PAYLOAD_SDK"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            build_version="$GITHUB_REF_NAME"
          else
            build_version="$(git describe --tags --always --dirty)"
          fi
          make -j"$(nproc)" BUILD_VERSION="$build_version"
          file game-compressor.elf
          readelf -h game-compressor.elf | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h game-compressor.elf | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'

      - name: Build experimental launcher eboot (when present)
        run: |
          if [[ -f tools/fullscreen-launcher/Makefile ]]; then
            make -C tools/fullscreen-launcher
            cp tools/fullscreen-launcher/out/eboot.bin launcher-eboot.bin
          fi

      - name: Checksums
        run: |
          files=(game-compressor.elf)
          [[ -f launcher-eboot.bin ]] && files+=(launcher-eboot.bin)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-compressor-${{ github.sha }}
          path: |
            game-compressor.elf
            launcher-eboot.bin
            SHA256SUMS

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(game-compressor.elf SHA256SUMS)
          [[ -f launcher-eboot.bin ]] && files+=(launcher-eboot.bin)

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            create_args=(--verify-tag)
          else
            branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            tag="build-${branch}-${GITHUB_RUN_NUMBER}"
            create_args=(--target "$GITHUB_SHA")
            [[ "$GITHUB_REF_NAME" == main ]] || create_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" "${create_args[@]}" \
              --generate-notes --title "Game Compressor $tag"
          fi
